name: CI

# Verificacion de cada PR (incluidos los PRs apilados sobre otras ramas) y de
# cada push a dev. Es el gate de la Definicion de Terminado: tipos, lint y
# pruebas de los dos proyectos de V2.

on:
  pull_request:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24.x"

jobs:
  desktop:
    name: desktop-app (tipos y pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: V2/desktop-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: V2/desktop-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Medication reference tests
        run: npm run test:medication --if-present

      - name: CIE-10 tests
        run: npm run test:cie10 --if-present

  portal:
    name: consultorio-app (lint, tipos y pruebas)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: consultorio_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d consultorio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: V2/consultorio-app
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/consultorio_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/consultorio_test?schema=public
      NEXTAUTH_SECRET: ci_nextauth_secret_min_32_chars_for_tests
      APP_BASE_URL: http://localhost:3000
      APP_TIMEZONE: America/Chihuahua
      QUESTIONNAIRE_TOKEN_SECRET: ci_questionnaire_secret_min_32_chars
      TERMS_VERSION: v1
      PRIVACY_VERSION: v1
      SMS_PROVIDER: mock
      SMS_BASE_URL: https://sms.example.com
      SMS_API_KEY: ci_sms_api_key_min_16_chars
      EMAIL_PROVIDER: mock
      EMAIL_BASE_URL: https://email.example.com
      EMAIL_API_KEY: ci_email_api_key_min_16_chars
      EMAIL_FROM: no-reply@example.com
      TWO_FACTOR_ENCRYPTION_KEY: ci_two_factor_encryption_key_32_chars
      PAYMENTS_PROVIDER: STRIPE
      PAYMENTS_WEBHOOK_SECRET: ci_payments_webhook_secret
      STRIPE_SECRET_KEY: sk_test_ci_placeholder_1234567890
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder_1234567890
      NOTIFICATION_CRON_SECRET: ci_notification_cron_secret
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: V2/consultorio-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      # `npm run env:check` exige .env.local, que no existe en CI: el contrato se
      # valida directo contra las variables del job.
      - name: Validate environment contract
        run: npx tsx src/lib/env.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:e2e
