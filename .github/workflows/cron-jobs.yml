name: Cron Jobs

# Tareas programadas del portal. Cada job llama a una ruta interna del portal
# autenticada con `Authorization: Bearer <NOTIFICATION_CRON_SECRET>` (helper
# `src/lib/auth/cron-auth.ts`). La prueba `tests/unit/cron-workflow.test.ts`
# comprueba que cada ruta referenciada aqui existe en `src/app/api/`.

on:
  schedule:
    # Procesar cola de notificaciones cada 5 minutos
    - cron: '*/5 * * * *'
    # Mantenimiento del buzon cada hora: holds vencidos, enlaces y tokens
    # expirados, purga por TTL de resumenes, documentos y preconsultas.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Job a ejecutar manualmente'
        required: true
        type: choice
        options:
          - notifications
          - maintenance

jobs:
  notifications:
    name: Procesar notificaciones pendientes
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'notifications' ||
      github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *'
    steps:
      - name: Invoke notifications dispatcher
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 -X POST \
            "${{ vars.APP_BASE_URL }}/api/internal/notifications/dispatch" \
            -H "Authorization: Bearer ${{ secrets.NOTIFICATION_CRON_SECRET }}")
          echo "HTTP status: $response"
          if [ "$response" != "200" ]; then
            echo "Error: endpoint returned $response"
            exit 1
          fi

  maintenance:
    name: Mantenimiento del buzon y expiraciones
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'maintenance' ||
      github.event_name == 'schedule' && github.event.schedule == '17 * * * *'
    steps:
      - name: Invoke maintenance cleanup
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 -X POST \
            "${{ vars.APP_BASE_URL }}/api/internal/maintenance/cleanup" \
            -H "Authorization: Bearer ${{ secrets.NOTIFICATION_CRON_SECRET }}")
          echo "HTTP status: $response"
          if [ "$response" != "200" ]; then
            echo "Error: endpoint returned $response"
            exit 1
          fi
