[package]
name = "desktop-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# En Windows, `bundled-sqlcipher-vendored-openssl` recompila OpenSSL completo
# durante el arranque y puede dejar `tauri dev` (y `cargo test` en builds
# frescos) aparentemente "colgado" varios minutos en `openssl-sys`, o fallar si
# la maquina no tiene un perl apto para compilar OpenSSL. Usamos SQLCipher
# bundlado enlazando contra un OpenSSL MSVC ya instalado via OPENSSL_DIR (ver
# `.cargo/config.toml`, local por maquina).
rusqlite = { version = "0.40.1", features = ["bundled-sqlcipher"] }
thiserror = "2.0.18"
reqwest = { version = "0.13.4", features = ["json", "cookies", "blocking"] }
uuid = { version = "1.23.3", features = ["v4"] }
chrono = "0.4.45"
sha2 = "0.11.0"
dryoc = "0.8.0"
base64 = "0.22.1"
# Lectura multiplataforma de RAM/CPU para recomendar el modelo Whisper local.
# Mantenido, auditable y MIT; evita FFI por plataforma para leer memoria total.
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }
# whisper.cpp para transcripcion local real. Opcional tras el feature
# `whisper-local`: compilarlo exige cadena nativa (CMake + LLVM/libclang). El
# build por defecto y las pruebas NO la necesitan. Verificado en Windows MSVC con
# LLVM: compila, enlaza y corre inferencia real (test de integracion ignorado
# `transcribes_real_audio_without_error`). Versiones <0.16 fallaban con el clang
# actual (layout/opaque en whisper-rs-sys), por eso se fija 0.16.
whisper-rs = { version = "0.16", optional = true }
# Diarizacion (separacion de hablantes) local con sherpa-onnx. Opcional tras el
# feature `diarization-local`: bundlea sherpa-onnx + ONNX Runtime y exige cadena
# nativa, igual que whisper-rs. El build por defecto y las pruebas NO la necesitan
# (el modulo `sherpa_diarization` provee un stub que degrada sin el feature). El
# binding real se compila y verifica en staging (regla 5), como el de Whisper.
sherpa-rs = { version = "0.6", optional = true }

[features]
# Activa el proveedor de transcripcion Whisper local (requiere cadena nativa).
whisper-local = ["dep:whisper-rs"]
# Backends de aceleracion de whisper.cpp. Se mantienen como features separados
# (compilan solo con la cadena nativa correspondiente, verificados en staging,
# regla 5) para que la matriz de distribucion elija por plataforma. El build por
# defecto y las pruebas NO necesitan ninguno.
#   - El medico tipico es CPU-only o, a lo sumo, con GPU integrada: por eso la
#     base es CPU acelerada con OpenBLAS/AVX2 y, donde haya GPU, Vulkan universal.
# Acelera la CPU con OpenBLAS (BLAS optimizado) — utilidad principal en equipos
# sin GPU, que son la mayoria.
whisper-openblas = ["whisper-local", "whisper-rs/openblas"]
# Vulkan acelera tanto GPU integrada (Intel/AMD) como dedicada (NVIDIA/AMD) en
# Windows/Linux: backend universal de GPU para el build de distribucion.
whisper-vulkan = ["whisper-local", "whisper-rs/vulkan"]
# Metal acelera en Apple Silicon (chip M) con memoria unificada: build de macOS.
whisper-metal = ["whisper-local", "whisper-rs/metal"]
# Compila Whisper con CUDA. Se mantiene separado para los equipos NVIDIA que
# prefieran CUDA sobre Vulkan; los demas usan Vulkan/CPU sin depender del toolkit.
whisper-cuda = ["whisper-local", "whisper-rs/cuda"]
# Activa la diarizacion local con sherpa-onnx (requiere cadena nativa).
diarization-local = ["dep:sherpa-rs"]

[dev-dependencies]
chrono = "0.4.45"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
